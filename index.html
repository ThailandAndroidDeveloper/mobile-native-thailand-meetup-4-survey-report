<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Native Thailand Meetup #4 Survey Report</title>
<meta name="description" content="Poll results from the attendees of Mobile Native Thailand Meetup #4.">
<style>
:root {
  --color-fg: #14181f; --color-fg-muted: #586273; --color-bg: #ffffff; --color-panel: #f5f7fb;
  --color-border-line: #dde3ec; --color-bad: #d64545;
  --cds-gap-xs: .25rem; --cds-gap-sm: .5rem; --cds-gap-md: 1rem; --cds-gap-lg: 1.5rem; --cds-gap-xl: 2rem;
  --cds-pad-sm: .5rem; --cds-pad-md: .75rem; --cds-pad-lg: 1.25rem; --cds-radius: 12px;
  --cds-font-size-heading: 1.125rem; --cds-font-weight-medium: 500;
  --cds-chart-muted: #aab5c8; --cds-ease-out: cubic-bezier(.16, 1, .3, 1); --cds-dur-slow: 500ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-fg: #eef1f6; --color-fg-muted: #9aa6b8; --color-bg: #0f141c; --color-panel: #171e29;
    --color-border-line: #283244; --cds-chart-muted: #4b5870; color-scheme: dark;
  }
}
body { margin: 0; background: var(--color-bg); color: var(--color-fg); padding: clamp(16px, 4vw, 40px); }
.dash-skeleton { background: color-mix(in srgb, var(--color-fg) 8%, transparent); border-radius: var(--cds-radius); }

.sv { max-width: 1800px; margin-inline: auto; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', 'Sarabun', 'Thonburi', 'Leelawadee UI', sans-serif; font-size: 16px; display: flex; flex-direction: column; gap: var(--cds-gap-xl); }
.sv h1 { font-family: inherit; font-weight: 600; font-size: 2rem; margin: 0; text-wrap: balance; }
.sv .lede { color: var(--color-fg-muted); margin: .4rem 0 0; font-size: 16px; }
.sv h2 { font-size: max(16px, var(--cds-font-size-heading)); font-weight: var(--cds-font-weight-medium); margin: 0 0 var(--cds-gap-sm); }
.sv .grid { display: grid; gap: var(--cds-gap-md); grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
.sv .card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-width: 0; display: flex; flex-direction: column; gap: var(--cds-gap-sm); }
.sv .card h3 { font-size: max(16px, var(--cds-font-size-heading)); font-weight: var(--cds-font-weight-medium); margin: 0; text-wrap: balance; }
.sv .note { color: var(--color-fg-muted); font-size: 16px; }
.sv .row { display: grid; grid-template-columns: minmax(5rem, 9rem) 1fr auto; gap: var(--cds-gap-sm); align-items: center; font-size: 16px; font-variant-numeric: tabular-nums; }
.sv .lbl { overflow-wrap: anywhere; }
.sv .track { height: 14px; background: color-mix(in srgb, var(--color-fg) 6%, transparent); border-radius: 4px; overflow: hidden; }
.sv .fill { height: 100%; border-radius: 4px; background: var(--cds-chart-muted); }
.sv .row.top .fill { background: var(--dash-top); }
.sv .val { color: var(--color-fg-muted); min-width: 5.5rem; text-align: right; white-space: nowrap; }
.sv .row.top .val { color: var(--color-fg); }
.sv .fail { font-size: 16px; display: flex; align-items: center; gap: .5rem; color: var(--color-fg-muted); min-height: 8rem; justify-content: center; }
.sv .fail i { width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
@keyframes svgrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: no-preference) { .sv .fill { transform-origin: left; animation: svgrow var(--cds-dur-slow) var(--cds-ease-out); } }

.sv .tabs { display: flex; gap: var(--cds-gap-xs); border-bottom: 1px solid var(--color-border-line); }
.sv .tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--color-fg-muted); font: inherit; font-size: 16px; padding: var(--cds-pad-sm) var(--cds-pad-md); cursor: pointer; margin-bottom: -1px; }
.sv .tab[aria-selected=true] { color: var(--color-fg); border-bottom-color: var(--color-fg); font-weight: var(--cds-font-weight-medium); }
.sv .tab:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -2px; }
.sv .posters { display: grid; gap: var(--cds-gap-lg); grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.sv .poster { display: flex; flex-direction: column; gap: var(--cds-gap-xs); margin: 0; min-width: 0; }
.sv .poster svg { border-radius: var(--cds-radius); border: 1px solid var(--color-border-line); }
.sv .poster figcaption { color: var(--color-fg-muted); font-size: 16px; }

</style>
</head>
<body>
<div id="dash-root">
<div class="sv" id="sv">
  <header>
    <h1>Mobile Native Thailand Meetup #4 Survey Report</h1>
    <p class="lede">Poll results from event attendees. Multiple-answer questions can add up to more than 100%.</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-results" aria-selected="true" aria-controls="pane-results">Results</button>
    <button class="tab" role="tab" id="tab-images" aria-selected="false" aria-controls="pane-images">Post images</button>
  </div>
  <div id="pane-results" role="tabpanel"><div id="sv-body" data-source="survey"><div class="card dash-skeleton" style="min-height:12rem"></div></div></div>
  <div id="pane-images" role="tabpanel" hidden>
    <div class="posters" id="sv-posters" data-source="survey"></div>
  </div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="data.js"></script>
<script src="dash-shim.js"></script>
<script src="logos.js"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const BG = '#0A1450', FG = '#FFFFFF', MUTE = 'rgba(255,255,255,0.68)', BAR = 'rgba(255,255,255,0.22)', DIM = 'rgba(255,255,255,0.12)';
  const ACC = '#FFFFFF', BLUE = '#4CC9FF', TEAL = '#B25CFF', CORAL = '#FF4B6E', PINK = '#FF6FB5';
  const FONT = "'Poppins','Montserrat','Kanit','Noto Sans Thai','Sarabun','Thonburi','Leelawadee UI',Tahoma,system-ui,sans-serif";
  const pct = d3.format('.0%');
  const mk = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.append(e);
    return e;
  };
  const T = (p, x, y, s, size, fill, o = {}) => mk('text', { x, y, 'font-size': size, fill, 'text-anchor': o.a || 'start', 'font-weight': o.w || 400, 'letter-spacing': o.ls || 0 }, p, s);

  const groups = [
    ['Who is building', [7, 8, 9]],
    ['What apps support', [10, 11, 12]],
    ['How the work ships', [13, 14, 16, 17]],
    ['AI coding agents', [15, 18]]
  ];
  const ordinal = new Set([9, 10, 11, 14, 18]);
  const body = document.getElementById('sv-body');
  const postersEl = document.getElementById('sv-posters');
  document.getElementById('sv').style.setProperty('--dash-top', dash.colors[0]);

  const tabs = { results: document.getElementById('tab-results'), images: document.getElementById('tab-images') };
  const panes = { results: document.getElementById('pane-results'), images: document.getElementById('pane-images') };
  const show = (name) => {
    for (const k in tabs) { tabs[k].setAttribute('aria-selected', String(k === name)); panes[k].hidden = k !== name; }
    dash.setLink('tab-' + name);
  };
  tabs.results.addEventListener('click', () => show('results'));
  tabs.images.addEventListener('click', () => show('images'));
  if (location.hash === '#tab-images') show('images');

  const TH = {
    7: 'ยังใช้ Objective-C หรือ Java อยู่หรือป่าว',
    8: 'ใช้ Jetpack Compose หรือ Swift UI หรือยัง',
    9: 'Mobile App ในบริษัทมีอายุนานสุดกี่ปี',
    10: 'iOS App ของคุณรองรับเวอร์ชันต่ำสุดที่เท่าไร',
    11: 'Android App ของคุณรองรับเวอร์ชันต่ำสุดที่เท่าไร',
    12: 'รองรับหน้าจอแบบไหนบ้าง',
    13: 'ใช้ Git Hosting เจ้าไหนอยู่',
    14: 'ถ้าต้อง Build App บน CI/CD ในบริษัท ตอนนี้ใช้เวลานานเท่าไร',
    15: 'ใช้ Ai Coding Agent ตัวไหนอยู่',
    16: 'ใช้เครื่องมืออะไรทำ End-to-end Testing',
    17: 'ทุกวันนี้รีวีวโค้ดยังไง',
    18: 'เสียค่า AI Coding Agent เดือนละเท่าไร'
  };
  const TOPIC = { 7: 'Objective-C / Java', 8: 'Compose / SwiftUI', 9: 'App age', 10: 'Minimum iOS', 11: 'Minimum Android', 12: 'Screen types', 13: 'Git hosting', 14: 'CI/CD build time', 15: 'AI coding agent', 16: 'E2E testing', 17: 'Code review', 18: 'AI spend' };
  const KIND = { 6: 'Sorted bars', 7: 'Sorted bars', 8: 'Sorted bars', 9: 'Columns in age order', 10: 'Columns in version order', 11: 'Columns in API order', 12: 'Sorted bars', 13: 'Sorted bars', 14: 'Columns in time order', 15: 'Sorted bars', 16: 'Sorted bars', 17: 'Sorted bars', 18: 'Columns in price order' };

  function titleSize(text) {
    const m = document.createElement('span');
    m.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:800 52px ' + FONT;
    m.textContent = text;
    document.body.append(m);
    const w = m.getBoundingClientRect().width;
    m.remove();
    const fit = Math.floor(52 * 912 / w);
    return w > 912 && fit >= 47 ? fit : 52;
  }

  function frame(q, en, n, multi) {
    const svg = mk('svg', { viewBox: '0 0 1080 1350', width: '100%', role: 'img', 'aria-label': en, 'font-family': FONT });
    svg.style.display = 'block';
    const defs = mk('defs', {}, svg);
    const grad = mk('linearGradient', { id: 'bg' + q, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    [['0', '#050A33'], ['0.45', '#0E1F8C'], ['1', '#050824']].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, grad));
    const blur = mk('filter', { id: 'blur' + q, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
    mk('feGaussianBlur', { stdDeviation: 70 }, blur);
    mk('rect', { width: 1080, height: 1350, fill: `url(#bg${q})` }, svg);
    const glow = mk('g', { filter: `url(#blur${q})`, opacity: 0.8 }, svg);
    mk('ellipse', { cx: 940, cy: 520, rx: 360, ry: 90, fill: '#E04FD0', transform: 'rotate(-12 940 520)' }, glow);
    mk('ellipse', { cx: 820, cy: 250, rx: 300, ry: 70, fill: '#3CC8FF', transform: 'rotate(-8 820 250)' }, glow);
    mk('ellipse', { cx: 120, cy: 760, rx: 220, ry: 300, fill: '#2B63FF' }, glow);
    mk('ellipse', { cx: 900, cy: 1120, rx: 300, ry: 80, fill: '#6A3DFF' }, glow);
    const lh = 74, lw = lh * 1000 / 438, tw = lh * 581 / 132, ly = 63;
    mk('image', { href: window.EVENT_LOGO, x: 80, y: ly, width: lw, height: lh }, svg);
    mk('image', { href: window.EVENT_TEXT, x: 80 + lw + 22, y: ly, width: tw, height: lh }, svg);
    mk('line', { x1: 80, x2: 1000, y1: 160, y2: 160, stroke: 'rgba(255,255,255,0.3)', 'stroke-width': 2 }, svg);
    const fo = mk('foreignObject', { x: 80, y: 190, width: 920, height: q ? 260 : 0 }, svg);
    const div = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    div.style.cssText = 'font-family:' + FONT + ';color:' + FG;
    if (q) {
    const h = document.createElement('div'); h.textContent = TH[q].replace(/ต่ำสุด/g, 'ต่ำ\u2060สุด').replace(/ในบริษัท/g, 'ใน\u2060บริษัท'); h.style.cssText = 'font-size:' + titleSize(h.textContent) + 'px;font-weight:800;line-height:1.25;text-wrap:balance';
    const c = document.createElement('div'); c.style.cssText = 'font-size:24px;font-weight:500;color:' + MUTE + ';margin-top:14px;line-height:1.3'; c.textContent = n + (n === 1 ? ' person answered' : ' people answered') + ' · ' + (multi ? 'Multiple answers' : 'Single answer');
    div.append(h, c); fo.append(div);
    }
    T(svg, 1000, 127, '21 October 2026', 28, 'rgba(255,255,255,0.5)', { a: 'end', w: 400 });
    let sx = 80;
    (window.SPONSORS || []).forEach((l, i) => {
      const h = i === 2 ? 47 : i === 1 ? 33 : i === 3 ? 41 : 36, w = h * l.w / l.h;
      mk('image', { href: l.src, x: sx, y: 1286 - h / 2, width: w, height: h }, svg);
      sx += w + 30;
    });
    if (q) T(svg, 1000, 1272, 'ผลสำรวจจากผู้เข้าร่วมงานเท่านั้น', 22, 'rgba(255,255,255,0.5)', { a: 'end' });
    if (q) T(svg, 1000, 1304, 'ไม่สามารถนำไปใช้งานในเชิงสถิติได้', 22, 'rgba(255,255,255,0.5)', { a: 'end' });
    return svg;
  }

  const THO = {
    6: { Other: 'อื่นๆ' },
    7: { 'Neither anymore': 'ไม่ได้ใช้ทั้งคู่แล้ว' },
    8: { 'Neither yet': 'ยังไม่ได้ใช้ทั้งคู่' },
    13: { Other: 'อื่นๆ' },
    16: { 'Handled by QA': 'ใช้ QA', Other: 'อื่นๆ' },
    17: { Myself: 'รีวิวด้วยตัวเอง', 'AI-assisted': 'ใช้ AI ช่วยรีวิว', 'No review': 'ไม่รีวิว' }
  };

  function bars(svg, items, n, v, q) {
    const sorted = items.slice().sort((a, b) => (a.option === 'Other') - (b.option === 'Other') || b.votes - a.votes);
    const top = d3.max(sorted, d => d.votes);
    const pitch = Math.min(230, 690 / sorted.length), barH = Math.min(84, pitch * 0.3);
    const big = pitch > 150, fs = big ? 44 : 34, vs = big ? 58 : 46;
    const th = THO[q] || {};
    const heights = sorted.map(() => fs + 16 + barH);
    const gap = Math.max(12, Math.min(90, (690 - d3.sum(heights)) / (sorted.length - 1)));
    let y0 = 470;
    sorted.forEach((d, i) => {
      const hi = d.votes === top && top > 0, thai = th[d.option];
      T(svg, 80, y0 + fs, thai || d.option, fs, FG, { w: 600 });
      const by = y0 + fs + 16;
      const val = mk('text', { x: 1000, y: y0 + fs + 4, 'text-anchor': 'end', 'font-size': vs, fill: FG, 'font-weight': 800 }, svg);
      mk('tspan', {}, val, pct(d.votes / n));
      mk('rect', { x: 80, y: by, width: 920, height: barH, rx: barH / 2, fill: DIM }, svg);
      mk('rect', { x: 80, y: by, width: Math.max(barH, 920 * d.votes / n), height: barH, rx: barH / 2, fill: hi ? ACC : BLUE }, svg);
      y0 += heights[i] + gap;
    });
  }

  function columns(svg, items, n, labels, fixedSize) {
    const slot = 920 / items.length, bw = Math.min(150, slot - 26), base = 1060, maxH = 520;
    const top = d3.max(items, d => d.votes), peak = top || 1;
    const maxLen = d3.max(items, d => labels(d.option, d)[0].length), l1Size = fixedSize || (maxLen > 14 ? 26 : maxLen > 9 ? 32 : 38);
    items.forEach((d, i) => {
      const cx = 80 + slot * i + slot / 2, h = maxH * d.votes / peak, hi = d.votes === top;
      mk('rect', { x: cx - bw / 2, y: base - h, width: bw, height: Math.max(h, 4), rx: 10, fill: hi ? ACC : BLUE }, svg);
      T(svg, cx, base - h - 18, pct(d.votes / n), 40, hi ? ACC : FG, { a: 'middle', w: 800 });
      const [l1, ...rest] = labels(d.option, d);
      T(svg, cx, base + 50, l1, l1Size, FG, { a: 'middle', w: 700 });
      let ly = base + 50;
      rest.forEach(r => {
        const o = typeof r === 'string' ? { t: r } : r;
        if (!o.t) return;
        ly += o.gap || 38;
        T(svg, cx, ly, o.t, o.s || 24, o.c || MUTE, { a: 'middle', w: o.w || 400 });
      });
    });
  }

  const osLabel = (o, prefix) => {
    const k = o.replace(/^(iOS|API) /, '');
    if (/ or lower$/.test(k)) return [prefix + ' ' + k.replace(' or lower', ''), { t: 'หรือต่ำกว่า', s: 22, c: FG, w: 500 }];
    if (/\+$/.test(k)) return [prefix + ' ' + k.replace('+', ''), { t: 'หรือสูงกว่า', s: 22, c: FG, w: 500 }];
    return [prefix + ' ' + k, ''];
  };
  const draw = {
    6: (g, i, n, v) => bars(g, i, n, v, 6), 7: (g, i, n, v) => bars(g, i, n, v, 7), 8: (g, i, n, v) => bars(g, i, n, v, 8), 12: (g, i, n, v) => bars(g, i, n, v, 12), 13: (g, i, n, v) => bars(g, i, n, v, 13), 15: (g, i, n, v) => bars(g, i, n, v, 15), 16: (g, i, n, v) => bars(g, i, n, v, 16), 17: (g, i, n, v) => bars(g, i, n, v, 17),
    9(svg, items, n) { columns(svg, items, n, o => [o.replace(' years', ' ปี'), '']); },
    10(svg, items, n) { columns(svg, items, n, o => osLabel(o, 'iOS'), 36); },
    11(svg, items, n) {
      const droid = { '20': 'Android 4', '21-22': 'Android 5', '24-25': 'Android 7', '26-27': 'Android 8', '28': 'Android 9', '29': 'Android 10', '30': 'Android 11' };
      columns(svg, items, n, o => {
        const k = o.replace(/^API /, '').replace(/ or lower$/, '').replace(/\+$/, '');
        const lines = [droid[k], { t: 'API ' + k, s: 21, gap: 28 }];
        if (/ or lower$/.test(o)) lines.push({ t: 'หรือต่ำกว่า', s: 21, c: FG, w: 500, gap: 38 });
        if (/\+$/.test(o)) lines.push({ t: 'หรือสูงกว่า', s: 21, c: FG, w: 500, gap: 38 });
        return lines;
      }, 22);
    },
    14(svg, items, n) {
      const th = { 'Under 10 min': 'น้อยกว่า 10 นาที', '60+ min': 'มากกว่า 60 นาที', 'No CI/CD': 'ไม่มี CI/CD' };
      columns(svg, items, n, o => [th[o] || o.replace(' min', ' นาที'), '']);
    },

    18(svg, items, n) { columns(svg, items, n, o => [o, '']); }
  };

  dash.onData(() => {
    const s = dash.data('survey');
    body.textContent = '';
    postersEl.textContent = '';
    if (s.status === 'loading') { body.className = 'dash-skeleton'; body.style.minHeight = '12rem'; return; }
    body.className = ''; body.style.minHeight = '';
    if (s.status !== 'ok') {
      const f = document.createElement('div'); f.className = 'fail';
      f.append(document.createElement('i'), 'Failed to load');
      body.append(f); return;
    }
    const rows = s.data.map(r => ({ q: +r.q, question: r.question, multi: r.multi === 'yes', option: r.option, order: +r.order, votes: +r.votes, n: +r.respondents }));
    const by = d3.group(rows, r => r.q);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:var(--cds-gap-xl)';
    groups.forEach(([title, qs]) => {
      const sec = document.createElement('section');
      const h = document.createElement('h2'); h.textContent = title;
      const grid = document.createElement('div'); grid.className = 'grid';
      qs.forEach(q => {
        const items = by.get(q); if (!items) return;
        const sorted = ordinal.has(q) ? items.slice().sort((a, b) => a.order - b.order) : items.slice().sort((a, b) => b.votes - a.votes);
        const n = items[0].n, max = d3.max(items, d => d.votes);
        const card = document.createElement('div'); card.className = 'card';
        const h3 = document.createElement('h3'); h3.textContent = items[0].question;
        const note = document.createElement('div'); note.className = 'note';
        note.textContent = n + ' answered' + (items[0].multi ? ' · pick all that apply' : '');
        card.append(h3, note);
        sorted.forEach(d => {
          const row = document.createElement('div'); row.className = 'row' + (d.votes === max && max > 0 ? ' top' : '');
          const l = document.createElement('span'); l.className = 'lbl'; l.textContent = d.option;
          const t = document.createElement('div'); t.className = 'track';
          const fl = document.createElement('div'); fl.className = 'fill'; fl.style.width = (d.votes / n * 100) + '%';
          t.append(fl);
          const v = document.createElement('span'); v.className = 'val'; v.textContent = d.votes + ' · ' + pct(d.votes / n);
          row.append(l, t, v); card.append(row);
        });
        grid.append(card);
      });
      sec.append(h, grid); wrap.append(sec);
    });
    body.append(wrap);

    const cover = document.createElement('figure'); cover.className = 'poster'; cover.id = 'poster-q0';
    const csvg = frame(0, 'Cover', 0, false);
    const cfo = mk('foreignObject', { x: 80, y: 470, width: 920, height: 560 }, csvg);
    const cdiv = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    cdiv.style.cssText = 'font-family:' + FONT + ';color:' + FG;
    const bar = document.createElement('div'); bar.style.cssText = 'width:120px;height:10px;border-radius:5px;background:' + BLUE + ';margin-bottom:44px';
    const ch = document.createElement('div'); ch.style.cssText = 'font-size:112px;font-weight:800;line-height:1.2;white-space:pre-line'; ch.textContent = 'ผลสำรวจสายงาน\nMobile Dev';
    const cs = document.createElement('div'); cs.style.cssText = 'font-size:40px;font-weight:500;color:' + MUTE + ';margin-top:40px;line-height:1.4;text-wrap:balance'; cs.textContent = 'จากผู้ร่วมงาน Mobile Native Thailand Meetup #4';
    cdiv.append(bar, ch, cs); cfo.append(cdiv);
    const ccap = document.createElement('figcaption'); ccap.textContent = 'Cover';
    cover.append(csvg, ccap); postersEl.append(cover);

    groups.flatMap(g => g[1]).filter(q => by.has(q)).forEach((q, pos) => {
      const items = by.get(q); if (!items || !draw[q]) return;
      const ordered = ordinal.has(q) ? items.slice().sort((a, b) => a.order - b.order) : items.slice().sort((a, b) => a.order - b.order);
      const n = items[0].n;
      const v = name => (items.find(d => d.option === name) || { votes: 0 }).votes;
      const fig = document.createElement('figure'); fig.className = 'poster'; fig.id = 'poster-q' + q;
      const svg = frame(q, items[0].question, n, items[0].multi);
      try { draw[q](mk('g', { transform: 'translate(0 0)' }, svg), ordered, n, v); } catch (e) { T(svg, 80, 700, 'Could not draw this chart', 32, CORAL); }
      const cap = document.createElement('figcaption'); cap.textContent = 'Q' + (pos + 1) + ' · ' + TOPIC[q];
      fig.append(svg, cap); postersEl.append(fig);
    });
  });
})();
